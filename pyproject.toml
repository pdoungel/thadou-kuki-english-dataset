[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bible-scraper"
version = "1.0.0"
description = "Reproducible, resumable Thadou-Kuki (THADBSI) <-> English (NIV) verse-aligned parallel corpus collector for bible.com."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT (project code only — the scraped Bible texts are NOT covered by this license; see LICENSE_NOTES.md)" }
dependencies = [
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
bible-scraper = "bible_scraper.cli:main"

[tool.setuptools]
packages = ["bible_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
